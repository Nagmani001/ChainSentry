type Transfer @entity(immutable: true) {
  id: Bytes!
  src: Bytes!
  dst: Bytes!
  wad: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Deposit @entity(immutable: true) {
  id: Bytes!
  dst: Bytes!
  wad: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}