services:
  postgres:
    image: postgres:16-alpine
    container_name: chainsentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainsentry
      POSTGRES_PASSWORD: chainsentry
      POSTGRES_DB: chainsentry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainsentry -d chainsentry"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: chainsentry-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: chainsentry
      CLICKHOUSE_USER: chainsentry
      CLICKHOUSE_PASSWORD: chainsentry
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config.d:/etc/clickhouse-server/config.d
      - ./users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data: